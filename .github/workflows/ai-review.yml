# Day 32: AI code review on every pull request.
#
# The diff of the PR (merge-base with the base branch -> head) is reviewed by
# backend/src/review: RAG over the project's docs and code (local embeddings,
# no API key needed) + one LLM call per batch of files. The report — potential
# bugs, architecture problems, recommendations — is posted as a PR comment
# (updated in place on every push) and as the job summary.
#
# Repository settings:
#   secrets.LLM_API_KEY       — key of the OpenAI-compatible LLM API (required)
#   vars.LLM_API_URL          — its base URL, e.g. https://api.aiai.by/v1 (default: https://api.openai.com/v1)
#   vars.REVIEW_MODEL         — model for the review (default: deepseek-v4-flash)
#   vars.REVIEW_FAIL_ON       — "high" or "medium": fail the check on bugs of that severity (default: never)

name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? Number('${{ inputs.pr }}');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            core.setOutput('number', pr.number);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);

      - name: Check out the PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ steps.pr.outputs.base_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci --workspace=backend --include-workspace-root

      # The embedding model (~120 MB) and the project index: only files changed
      # since the cached index are re-embedded.
      - name: Cache embedding model and project index
        uses: actions/cache@v4
        with:
          path: |
            backend/data/rag/models
            backend/data/dev-assistant
          key: ai-review-index-${{ github.sha }}
          restore-keys: ai-review-index-

      - name: Review
        id: review
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ vars.LLM_API_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-v4-flash' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-v4-flash' }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            {
              echo '<!-- ai-code-review -->'
              echo '## 🤖 AI-ревью кода'
              echo
              echo 'Ревью пропущено: не задан секрет `LLM_API_KEY` (у PR из форка секретов нет).'
            } > ../review.md
            exit 0
          fi
          npm run -s review -- \
            --base "origin/${{ steps.pr.outputs.base_ref }}" \
            --head "${{ steps.pr.outputs.head_sha }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --sha "${{ steps.pr.outputs.head_sha }}" \
            --out ../review.md --json ../review.json \
            ${{ vars.REVIEW_FAIL_ON && format('--fail-on {0}', vars.REVIEW_FAIL_ON) || '' }} \
            > /dev/null

      - name: Post the review to the pull request
        if: ${{ always() && hashFiles('review.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await core.summary.addRaw(body).write();
            const marker = '<!-- ai-code-review -->';
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
              core.info(`Updated review comment ${previous.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              core.info(`Posted review comment ${data.html_url}`);
            }

      - name: Keep the raw review
        if: ${{ always() && hashFiles('review.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: |
            review.md
            review.json
