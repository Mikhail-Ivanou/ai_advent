# Run from this directory: `docker compose up -d --build`.
# Add `--profile tls` to put Caddy in front with an automatic Let's Encrypt
# certificate for $DOMAIN (then set WEATHER_BIND=127.0.0.1 so the plain-HTTP
# port isn't exposed publicly).
services:
  weather:
    build:
      context: ..
      dockerfile: mcp-weather/Dockerfile
    env_file: .env
    environment:
      PORT: 3002
    ports:
      - '${WEATHER_BIND:-0.0.0.0}:3002:3002'
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    depends_on: [weather]
    # Not `${DOMAIN:?}`: compose interpolates every service, even ones whose
    # profile is off, so a required variable would break the plain HTTP setup.
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
